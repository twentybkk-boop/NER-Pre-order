name: Fix preorder order UX
on:
  push:
    paths:
      - '.github/workflows/fix-order-ux.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fix_order_ux.py
      - run: |
          grep -q 'decrementMenuItem' index.html
          grep -q 'menu-qty-' index.html
          grep -q 'liff.sendMessages' index.html
          grep -q 'isMondayDate' index.html
          git diff --check
      - run: |
          printf '\n## 2026-09-08 12:17 ICT\n- Restored per-menu +/- quantity controls.\n- Fixed malformed LINE receipt by joining explicit message lines with newline characters.\n- Preserved add-on flow, Monday guard, prices, cart totals, and LIFF sendMessages.\n' >> CURRENT_HANDOFF.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CURRENT_HANDOFF.md
          git commit -m 'Restore quantity controls and format LINE receipt'
          git push
