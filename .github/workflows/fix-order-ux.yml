name: Fix preorder order UX
on:
  push:
    paths:
      - '.github/workflows/fix-order-ux.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_quantity_confirm_cart.py
      - run: |
          grep -q 'adjustPendingMenuQty' index.html
          grep -q 'addSelectedNormalItems' index.html
          grep -q 'openSelectedAddonModal' index.html
          grep -q 'menu-cart-btn' index.html
          grep -q 'liff.sendMessages' index.html
          grep -q 'isMondayDate' index.html
          git diff --check
      - run: |
          printf '\n## 2026-09-08 12:31 ICT\n- Changed menu quantity UX to two-step selection: +/- adjusts pending quantity only; Add to cart commits it.\n- Normal items add selected copies together; add-on items keep the existing add-on modal and commit selected copies after confirmation.\n- Pending quantity resets after successful add; cart totals and LINE receipt use committed cart entries only.\n- Preserved Monday guard, LIFF sendMessages, menu prices, and formatted LINE receipt.\n' >> CURRENT_HANDOFF.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CURRENT_HANDOFF.md
          git commit -m 'Add quantity then cart confirmation'
          git push
