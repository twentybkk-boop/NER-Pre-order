name: Fix preorder order UX
on:
  push:
    paths:
      - '.github/workflows/fix-order-ux.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair quantity controls and LINE receipt formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="""          if (item.allowAddOn) {
            actionSectionHtml = `<div class=\"card-action\"><button type=\"button\" onclick=\"openAddonModal('${item.id}', '${item.nameTh}', '${item.nameEn}', ${item.price})\" class=\"btn btn-secondary card-btn\">${currentLang === 'th' ? 'เลือก Add-on / ใส่ตะกร้า' : 'Add-ons / Add to cart'}</button></div>`;
          } else {
            actionSectionHtml = `<input type=\"text\" id=\"note-${item.id}\" class=\"item-note\" placeholder=\"${currentLang === 'th' ? 'หมายเหตุ เช่น ไม่เอาผัก, เผ็ดน้อย...' : 'Note e.g. no veg, less spicy...'}\"><div class=\"card-action\"><button type=\"button\" onclick=\"addNormalItemToCart('${item.id}', '${item.nameTh}', '${item.nameEn}', ${item.price})\" class=\"btn btn-secondary card-btn\">${currentLang === 'th' ? 'ใส่ตะกร้า' : 'Add to cart'}</button></div>`;
          }
"""
          new="""          const plusAction = item.allowAddOn
            ? `openAddonModal('${item.id}', '${item.nameTh}', '${item.nameEn}', ${item.price})`
            : `addNormalItemToCart('${item.id}', '${item.nameTh}', '${item.nameEn}', ${item.price}, true)`;
          const noteHtml = item.allowAddOn ? '' : `<input type=\"text\" id=\"note-${item.id}\" class=\"item-note\" placeholder=\"${currentLang === 'th' ? 'หมายเหตุ เช่น ไม่เอาผัก, เผ็ดน้อย...' : 'Note e.g. no veg, less spicy...'}\">`;
          actionSectionHtml = `${noteHtml}<div class=\"card-action menu-qty-action\"><div class=\"qty-control menu-qty-control\" aria-label=\"Quantity\"><button type=\"button\" class=\"qty-btn\" aria-label=\"Decrease\" onclick=\"decrementMenuItem('${item.id}')\">−</button><span class=\"qty-val\" id=\"menu-qty-${item.id}\">${getItemCartQty(item.id)}</span><button type=\"button\" class=\"qty-btn\" aria-label=\"Increase\" onclick=\"${plusAction}\">+</button></div>${item.allowAddOn ? `<span class=\"menu-qty-hint\">${currentLang === 'th' ? '+ เพื่อเลือก Add-on' : '+ for add-ons'}</span>` : ''}</div>`;
"""
          if old not in s: raise SystemExit('menu action block not found')
          s=s.replace(old,new,1)

          anchor="""    function addNormalItemToCart(id, nameTh, nameEn, price) {
      const noteInput = document.getElementById(`note-${id}`);
      const noteVal = noteInput ? noteInput.value.trim() : \"\";
      cart.push({ cartId: Date.now() + Math.random(), id: id, nameTh: nameTh, nameEn: nameEn, basePrice: price, addOns: [], totalPrice: price, note: noteVal });
      if(noteInput) noteInput.value = \"\";
      updateCartBadge();
      alert(currentLang === 'th' ? \"เพิ่มสินค้าลงในตะกร้าเรียบร้อยครับ\" : \"Item added to cart successfully!\");
    }
"""
          repl="""    function getItemCartQty(id) {
      return cart.filter(item => item.id === id).length;
    }

    function updateMenuQtyDisplays() {
      document.querySelectorAll('[id^=\"menu-qty-\"]').forEach(el => {
        const id = el.id.replace('menu-qty-', '');
        el.innerText = getItemCartQty(id);
      });
    }

    function decrementMenuItem(id) {
      for (let i = cart.length - 1; i >= 0; i--) {
        if (cart[i].id === id) {
          cart.splice(i, 1);
          updateCartBadge();
          return;
        }
      }
    }

    function addNormalItemToCart(id, nameTh, nameEn, price, silent = false) {
      const noteInput = document.getElementById(`note-${id}`);
      const noteVal = noteInput ? noteInput.value.trim() : \"\";
      cart.push({ cartId: Date.now() + Math.random(), id: id, nameTh: nameTh, nameEn: nameEn, basePrice: price, addOns: [], totalPrice: price, note: noteVal });
      if(noteInput) noteInput.value = \"\";
      updateCartBadge();
      if(!silent) alert(currentLang === 'th' ? \"เพิ่มสินค้าลงในตะกร้าเรียบร้อยครับ\" : \"Item added to cart successfully!\");
    }
"""
          if anchor not in s: raise SystemExit('addNormalItemToCart block not found')
          s=s.replace(anchor,repl,1)

          old_update="""      document.getElementById('totalPrice').innerText = totalAmount.toLocaleString();
    }
"""
          new_update="""      document.getElementById('totalPrice').innerText = totalAmount.toLocaleString();
      updateMenuQtyDisplays();
    }
"""
          if old_update not in s: raise SystemExit('updateCartBadge tail not found')
          s=s.replace(old_update,new_update,1)

          start=s.index('    function submitFinalOrder() {')
          end=s.index('\n    init();', start)
          new_submit=r'''    function submitFinalOrder() {
      if(!validateServiceDate()) return;
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const guests = document.getElementById('guests').value;
      const date = document.getElementById('date').value;
      const time = `${document.getElementById('hour').value}:${document.getElementById('minute').value.padStart(2,'0')} ${document.getElementById('ampm').value}`;
      const lines = [
        '🔥 [DIGITAL PRE-ORDER RECEIPT]',
        '----------------------------------',
        '👤 ข้อมูลผู้จอง',
        `ชื่อผู้จอง: ${name}`,
        `เบอร์โทร: ${phone}`,
        `จำนวน: ${guests} ท่าน`,
        `วันที่: ${date}`,
        `เวลา: ${time}`,
        '----------------------------------',
        '📋 รายการอาหารในตะกร้า'
      ];
      cart.forEach((item, index) => {
        lines.push(`${index + 1}. ${item.nameTh}`);
        lines.push(`   ราคา: ${item.totalPrice.toLocaleString()} บาท`);
        if(item.addOns && item.addOns.length > 0) item.addOns.forEach(a => lines.push(`   + Add-on: ${a.nameTh} x${a.qty}`));
        if(item.note) lines.push(`   หมายเหตุ: ${item.note}`);
      });
      lines.push(
        '----------------------------------',
        `💰 ยอดรวมสุทธิ: ${document.getElementById('totalPrice').innerText} บาท`,
        '----------------------------------',
        '* ทางร้านไม่มีการเก็บมัดจำการจอง',
        'THANK YOU FOR YOUR RESERVATION'
      );
      const finalMsg = lines.join('\n');
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = currentLang === 'th' ? 'กำลังส่งออเดอร์...' : 'Sending order...';
      btn.disabled = true;
      if (liff.isInClient()) {
        liff.sendMessages([{ type: 'text', text: finalMsg }]).then(() => {
          alert(currentLang === 'th' ? "ส่งใบเสร็จออเดอร์เข้าห้องแชท LINE OA ของร้านสำเร็จ!" : "Order sent to LINE OA successfully!");
          liff.closeWindow();
        }).catch((err) => {
          alert("Error: " + err.message);
          btn.innerHTML = currentLang === 'th' ? 'ส่งออเดอร์เข้า LINE OA ร้านทันที' : 'Send Order to Official LINE';
          btn.disabled = false;
        });
      } else {
        alert(currentLang === 'th' ? "กรุณาใช้งานผ่านเมนูใน LINE OA ของร้านครับ" : "Please open via LINE OA menu.");
        btn.innerHTML = currentLang === 'th' ? 'ส่งออเดอร์เข้า LINE OA ร้านทันที' : 'Send Order to Official LINE';
        btn.disabled = false;
      }
    }
'''
          s=s[:start]+new_submit+s[end:]

          css="""
    .menu-qty-action { display:flex; align-items:center; gap:9px; justify-content:flex-end; }
    .menu-qty-control { min-width:116px; justify-content:space-between; border-color:rgba(244,220,164,.46); background:rgba(18,37,27,.62); }
    .menu-qty-control .qty-btn { width:40px; height:40px; font-size:22px; color:var(--gold-2); }
    .menu-qty-control .qty-val { width:30px; font-size:14px; }
    .menu-qty-hint { color:var(--muted-2); font-size:9px; }
"""
          s=s.replace('  </style>',css+'  </style>',1)
          p.write_text(s)
          PY
      - name: Regression checks
        run: |
          grep -q "lines.join('\\n')" index.html
          grep -q 'decrementMenuItem' index.html
          grep -q 'menu-qty-' index.html
          grep -q 'liff.sendMessages' index.html
          grep -q 'isMondayDate' index.html
          git diff --check
      - name: Append handoff
        run: |
          cat >> CURRENT_HANDOFF.md <<'EOF'

          ## 2026-09-08 12:17 ICT
          - Restored per-menu +/- quantity controls on menu cards without changing menu prices, add-on rules, Monday guard, or LIFF delivery.
          - Root cause of malformed LINE receipt: JavaScript template literals used backslash-newline continuations, which removed intended line breaks. Rebuilt outgoing receipt from explicit lines joined with newline characters.
          - Quantity count is derived from cart state; minus removes the latest matching cart entry, plus adds a normal item or opens the existing add-on modal for add-on-capable items.
          - Regression checks: LINE liff.sendMessages present, Monday guard present, quantity functions present, diff whitespace clean.
          EOF
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CURRENT_HANDOFF.md
          git commit -m 'Restore quantity controls and format LINE receipt'
          git push
