name: Install menu sprite

on: [push]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch preorder
        run: python3 .github/scripts/install_menu_sprite.py
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/menu/menu-sprite.webp
          grep -q 'const LIFF_ID = "2010784971-mH3KqiRT"' index.html
          grep -q 'function isMondayDate' index.html
          grep -q 'MENU_SPRITE_POSITIONS\[item.id\]' index.html
          grep -q 'menu-photo-sprite' index.html
          rm -f assets/menu/*.b64tmp
          rm -rf .github/menu-payload
          rm -f .github/scripts/apply_menu_images.py
          rm -f .github/workflows/apply-approved-menu-images.yml
          rm -f .github/scripts/install_menu_sprite.py
          rm -f .github/workflows/install-menu-sprite.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add approved menu photos to preorder'
          git push
