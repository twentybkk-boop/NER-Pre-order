name: Apply approved preorder menu images

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved menu images
        shell: bash
        run: |
          set -euo pipefail
          test -f .menu-assets.zip
          unzip -o .menu-assets.zip
          python3 .github/scripts/apply_menu_images.py
          test "$(find assets/menu -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 22
          grep -q 'const LIFF_ID = "2010784971-mH3KqiRT"' index.html
          grep -q 'function isMondayDate' index.html
          grep -q 'class="menu-photo"' index.html
          rm -f .menu-assets.zip
          rm -f .github/scripts/apply_menu_images.py
          rm -f .github/workflows/apply-approved-menu-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Add approved preorder menu photos'
          git push
