name: Fix chicken pop image mapping
on:
  push:
    paths:
      - '.github/workflows/fix-chicken-pop-image.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct Chicken Pops image mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "      'a2': '33.333% 80%',"
          new = "      'a1': '33.333% 80%',"
          if old not in s:
              raise SystemExit('expected a2 sprite mapping not found')
          if "'a1': '33.333% 80%'" in s:
              raise SystemExit('a1 mapping already exists unexpectedly')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify mapping and preserve menu logic
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          checks = {
            'Chicken Pops menu item': "{ id: 'a1', nameTh: \"ไก่ป๊อป\", nameEn: \"Chicken Pops\", price: 79",
            'Chicken Pops image mapping': "'a1': '33.333% 80%'",
            'Tater Tots no wrong image mapping': "'a2': '33.333% 80%'" not in s,
            'Monday guard': 'isMondayDate',
            'LIFF send': 'liff.sendMessages',
          }
          for name, needle in checks.items():
            ok = needle if isinstance(needle, bool) else needle in s
            print(name, 'PASS' if ok else 'FAIL')
            if not ok: raise SystemExit(1)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-chicken-pop-image.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-chicken-pop-image.yml
          git commit -m 'Correct Chicken Pops preorder image mapping'
          git push
