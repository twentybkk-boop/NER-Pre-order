name: Remove preorder menu photos

on:
  push:
    paths:
      - '.github/workflows/remove-menu-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove menu photos and restore placeholders
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove all menu image mappings while preserving menu data and business logic.
          s = re.sub(r", image: 'assets/menu/[^']+'", '', s)

          # Remove photo-only styling.
          for line in [
              "    .menu-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }\n",
              "    .menu-visual.has-photo::before { display: none; }\n",
              "    .menu-visual.has-photo::after { background: linear-gradient(180deg, transparent 52%, rgba(14,31,21,.18)); }\n",
          ]:
              s = s.replace(line, '')

          # Force every menu card to use the existing neutral placeholder.
          old = "          const visualHtml = item.image ? `<div class=\"menu-visual has-photo\"><img class=\"menu-photo\" src=\"${item.image}\" alt=\"${itemName}\" loading=\"lazy\" decoding=\"async\"></div>` : `<div class=\"menu-visual\">${placeholderIcon()}</div>`;"
          new = "          const visualHtml = `<div class=\"menu-visual\">${placeholderIcon()}</div>`;"
          if old not in s:
              raise SystemExit('Expected menu photo render line not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          rm -rf assets/menu
          rm -f .github/workflows/remove-menu-photos.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove preorder menu photos"
          git push
