name: Fix remaining preorder sprite mappings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-menu-sprite-mapping.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only incorrect sprite mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              "'a3': '66.667% 80%',": "'a3': '100% 80%',",
              "'a4': '100% 80%',": "'a4': '0% 100%',",
              "'d1': '0% 100%',": "'d1': '33.333% 100%',",
              "'d3': '33.333% 100%',": "'d3': '66.667% 100%',",
              "background-image: url('assets/menu/menu-sprite.webp');": "background-image: url('assets/menu/menu-sprite.webp?v=20260907-3');",
          }
          for old, new in replacements.items():
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Regression verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          expected = [
              "'m9': '33.333% 40%'",
              "'m10': '66.667% 40%'",
              "'m11': '100% 40%'",
              "'a1': '33.333% 80%'",
              "'a3': '100% 80%'",
              "'a4': '0% 100%'",
              "'d1': '33.333% 100%'",
              "'d3': '66.667% 100%'",
              "menu-sprite.webp?v=20260907-3",
              "function isMondayDate",
              "liff.sendMessages",
          ]
          for value in expected:
              assert value in text, value
          # No approved photo exists for these two, so they must remain placeholders.
          assert "'a2':" not in text.split('const MENU_SPRITE_POSITIONS = {',1)[1].split('};',1)[0]
          assert "'d2':" not in text.split('const MENU_SPRITE_POSITIONS = {',1)[1].split('};',1)[0]
          PY
          git diff --check
          git diff -- index.html
      - name: Record handoff and project memory
        shell: bash
        run: |
          set -euo pipefail
          ts="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if [ ! -f PROJECT_MEMORY.md ]; then
            cat > PROJECT_MEMORY.md <<'EOF'
          # PROJECT_MEMORY

          ## Preorder menu image sprite contract
          - Preserve the existing 4 x 6 sprite tile order. Do not rebuild or shift unrelated tiles when correcting one menu photo.
          - Approved beef mapping: m9 leaf/chuck = col 2 row 3; m10 ribeye = col 3 row 3; m11 brisket/tiger cry = col 4 row 3.
          - Appetizer/dessert mapping for current sprite: a1 Chicken Pops = col 2 row 5; a3 Crispy Fish Crackers = col 4 row 5; a4 Calamari = col 1 row 6; d1 Banana Samosa = col 2 row 6; d3 Toddy Palm = col 3 row 6.
          - a2 Hash Brown and d2 Chilled Sala have no approved sprite image and must remain placeholders until the user supplies/approves images.
          - When changing a sprite image, verify every mapped tile after the edit; never infer success from the target tile alone.
          EOF
          fi
          if [ ! -f CURRENT_HANDOFF.md ]; then
            printf '# CURRENT_HANDOFF\n\n' > CURRENT_HANDOFF.md
          fi
          cat >> CURRENT_HANDOFF.md <<EOF
          ## ${ts}
          - Debugged preorder sprite regression after beef photo replacement.
          - Root cause: image binary layout was correct for the newly approved beef photos, but downstream appetizer/dessert IDs still pointed to pre-insertion tile positions, causing cascading wrong images.
          - Fix: remapped a3->100% 80%, a4->0% 100%, d1->33.333% 100%, d3->66.667% 100%; kept a1->33.333% 80%; left a2 and d2 unmapped placeholders.
          - Added sprite cache-buster so LIFF/Safari cannot keep the stale binary.
          - Regression checks: m9/m10/m11, Monday guard, LIFF sendMessages, placeholder rules, and git diff --check.
          EOF
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-menu-sprite-mapping.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html CURRENT_HANDOFF.md PROJECT_MEMORY.md .github/workflows/fix-menu-sprite-mapping.yml
          git commit -m 'Correct preorder image sprite mappings'
          git push origin HEAD:main
