name: Replace beef menu images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-beef-images.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace approved beef sprite asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/menu
          cat > /tmp/menu-sprite.b64 <<'EOF'
[... ELLIPSIZATION ...]
EOF
          base64 -d /tmp/menu-sprite.b64 > assets/menu/menu-sprite.webp
          test "$(wc -c < assets/menu/menu-sprite.webp)" -eq 32970
          python3 - <<'PY2'
          from pathlib import Path
          d=Path('assets/menu/menu-sprite.webp').read_bytes()
          assert d[:4]==b'RIFF' and d[8:12]==b'WEBP'
          t=Path('index.html').read_text()
          for s in ["'m9': '33.333% 40%'", "'m10': '66.667% 40%'", "'m11': '100% 40%'", "'a1': '33.333% 80%'", 'function isMondayDate', 'liff.sendMessages']:
              assert s in t, s
          PY2
          rm -f .github/workflows/replace-beef-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Replace beef menu images with approved photos'
          git push
