name: Apply preorder menu sprite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-menu-sprite.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install approved menu images
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets/menu
          cat .github/payload/menu-sprite.part*.b64 | base64 -d > assets/menu/menu-sprite.webp

          test "$(wc -c < assets/menu/menu-sprite.webp)" -eq 19412
          python3 - <<'PY'
          from pathlib import Path
          import re

          image = Path('assets/menu/menu-sprite.webp').read_bytes()
          assert image[:4] == b'RIFF', image[:4]
          assert image[8:12] == b'WEBP', image[8:12]

          text = Path('index.html').read_text(encoding='utf-8')
          required = ['s1','s2','s3','s4','s5','s6','m1','m2','m4','m9','m10','m11','m12','m13','m14','v1','e5','a2','a3','a4','d1','d3']
          start = text.index('const MENU_SPRITE_POSITIONS = {')
          end = text.index('};', start)
          block = text[start:end]
          mapped = re.findall(r"'([^']+)'\s*:\s*'[^']+'", block)
          assert mapped == required, (mapped, required)
          assert "background-image: url('assets/menu/menu-sprite.webp')" in text
          assert 'const spritePosition = MENU_SPRITE_POSITIONS[item.id];' in text
          assert 'const LIFF_ID = "2010784971-mH3KqiRT"' in text
          assert 'function isMondayDate' in text
          PY

          rm -f assets/menu/*.b64tmp
          rm -f assets/menu/menu-sprite.webp.b64
          rm -rf .github/payload
          rm -f .github/scripts/apply_menu_sprite.py
          rm -f .github/workflows/apply-menu-sprite.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Add approved preorder menu images'
          git push
