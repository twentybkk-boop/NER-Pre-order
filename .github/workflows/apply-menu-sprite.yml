name: Apply preorder menu sprite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-menu-sprite.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild approved image sprite and patch preorder UI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p assets/menu
          cat .github/payload/menu-sprite.part*.b64 | base64 -d > assets/menu/menu-sprite.webp

          test "$(wc -c < assets/menu/menu-sprite.webp)" -eq 19412
          python3 - <<'PY'
          from pathlib import Path
          data = Path('assets/menu/menu-sprite.webp').read_bytes()
          assert data[:4] == b'RIFF', data[:4]
          assert data[8:12] == b'WEBP', data[8:12]
          PY

          python3 .github/scripts/apply_menu_sprite.py

          grep -q 'const LIFF_ID = "2010784971-mH3KqiRT"' index.html
          grep -q 'function isMondayDate' index.html
          grep -q 'class="menu-sprite"' index.html
          test "$(grep -o 'spriteIndex:' index.html | wc -l)" -eq 22

          rm -f assets/menu/*.b64tmp
          rm -f assets/menu/menu-sprite.webp.b64
          rm -rf .github/payload
          rm -f .github/scripts/apply_menu_sprite.py
          rm -f .github/workflows/apply-menu-sprite.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Add approved preorder menu images'
          git push
