name: Vendor Canva menu photos

on:
  push:
    paths:
      - '.github/workflows/vendor-canva-menu-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Canva menu photos and update UI
        env:
          S1_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:133/quality:75/uri:ifs%3A%2F%2FM%2F60d0dbd8-117c-4fed-bb8b-5c138ca2cc36/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAP97vsi9Umexv_-fB3qwpCP6WsLXCe8v_Vw72xHJ7UjH&exp=1788772695&osig=AAAAAAAAAAAAAAAAAAAAAAEkjwS7A0KkuiJIqVlNYFV_qP9FkwBy6PII-f2BvKqr&signer=media-rpc&x-canva-quality=thumbnail"
          S2_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2Fd62baffa-7d05-489e-8cdd-e2231369c085/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAKJnIkpScS4DbrIy8_k2A-ok0KiS1jqBJMq6t522-1Wp&exp=1788770342&osig=AAAAAAAAAAAAAAAAAAAAADca1ykcs2NMNpbhn3zq7gBh1fEC9_WdM0ouXPUFGrKk&signer=media-rpc&x-canva-quality=thumbnail"
          S3_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:133/quality:75/uri:ifs%3A%2F%2FM%2F05e3404e-e851-4bcf-bc09-65c570054057/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAL4ShdPxNPsyMVy-gpkPo1P2vnm9ffCABD_67kk-FV5z&exp=1788772634&osig=AAAAAAAAAAAAAAAAAAAAAAHydvffrQzrf7jQXomMigYGjFSgnEijitTfoXwFnlje&signer=media-rpc&x-canva-quality=thumbnail"
          S5_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:133/quality:75/uri:ifs%3A%2F%2FM%2Fc20d2ab4-b882-4095-a79b-fda03a86d891/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAABswZPwj97cTivLMC8axVNS3lRSYn67MjZpusvXOOezu&exp=1788771942&osig=AAAAAAAAAAAAAAAAAAAAAIowQwWPVZr_0rGQTcn1i2Xba7RzaK-3UaGrpy8unsmf&signer=media-rpc&x-canva-quality=thumbnail"
          S6_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:133/quality:75/uri:ifs%3A%2F%2FM%2F75d5299f-44ea-4c71-aecc-5e5e156d5148/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOcsoeIJRfrgbh0ohs4ztl-jdRvbmmqE_ucK_iazthK5&exp=1788772415&osig=AAAAAAAAAAAAAAAAAAAAAIvoExZEFp-SXVHfGIMSrxX70XEyH_H1314y6c9YEPfY&signer=media-rpc&x-canva-quality=thumbnail"
          SHRIMP_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F10846464-d201-476e-8534-dbe66efd48b4/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAOEwB36xVwrU1Ft54fEJYKejErD_e2wj9SG_C-siy3Rj&exp=1788773153&osig=AAAAAAAAAAAAAAAAAAAAAPftuIBZoAJWM1q2E21qNVQBXrMIcZJKCgBcNrov7SI2&signer=media-rpc&x-canva-quality=thumbnail"
          VEG_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F80d1c4b6-da57-4c9d-8315-567754feeb5e/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAKc2KL7vktihIb2-NiuB5TB9doRnTI4Qa_gnqmnykQzS&exp=1788770255&osig=AAAAAAAAAAAAAAAAAAAAANrImD3HGPVUM979GbCWTwIZJWt_BjaqQgggwUX2IUj2&signer=media-rpc&x-canva-quality=thumbnail"
          CRACKER_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F73842f60-f0b1-473a-a683-414580b50c32/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAFlsPUwUPTsMSyOz7DsKSXpajVbkXfUUnSr9iF2nFz3X&exp=1788772463&osig=AAAAAAAAAAAAAAAAAAAAACFOSq10yYVW0nB9mP9PVrzX6PKJoI3aWiYl0VL0NDrn&signer=media-rpc&x-canva-quality=thumbnail"
          CALAMARI_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F49af5766-7cf2-4594-a2d7-5ff6b8c7c146/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAAwDMFcnS9Q1XvtCJ7rXiEQECsu5yk8MS8rgKMinDJ4i&exp=1788769828&osig=AAAAAAAAAAAAAAAAAAAAADRGSN-G3QRimwHiaSqDpeL0KUYh0ZrD37xmUmHkSMYz&signer=media-rpc&x-canva-quality=thumbnail"
          SAMOSA_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2Fa798ce9d-a14a-4bd4-8067-75f60131b6c1/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAALyzlU1a_3Hch7UbynCq8dC_GnaTQ2W-XLoO-fSCi-B&exp=1788772557&osig=AAAAAAAAAAAAAAAAAAAAAFeniZpFm4QGvUCRa4UzeSar2Z38E2OY3JuiJVVV-_rg&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p assets/menu
          curl --fail --location --retry 3 "$S1_URL" -o assets/menu/pork-seafood-set.jpg
          curl --fail --location --retry 3 "$S2_URL" -o assets/menu/beef-set.jpg
          curl --fail --location --retry 3 "$S3_URL" -o assets/menu/pork-set.jpg
          curl --fail --location --retry 3 "$S5_URL" -o assets/menu/ready-normal.jpg
          curl --fail --location --retry 3 "$S6_URL" -o assets/menu/ready-extra-pork.jpg
          curl --fail --location --retry 3 "$SHRIMP_URL" -o assets/menu/shrimp.jpg
          curl --fail --location --retry 3 "$VEG_URL" -o assets/menu/vegetable-combo.jpg
          curl --fail --location --retry 3 "$CRACKER_URL" -o assets/menu/crispy-fish-crackers.jpg
          curl --fail --location --retry 3 "$CALAMARI_URL" -o assets/menu/calamari.jpg
          curl --fail --location --retry 3 "$SAMOSA_URL" -o assets/menu/banana-samosa.jpg

          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<span class="chip"><span class="chip-dot"></span><span data-lang-th="ส่งออเดอร์ผ่าน LINE" data-lang-en="Order via LINE">ส่งออเดอร์ผ่าน LINE</span></span>'
          new = '<span class="chip chip-long"><span class="chip-dot"></span><span data-lang-th="ระบบจะส่งรายการอาหารผ่าน LINE chat ให้อัตโนมัติ" data-lang-en="Your order list will be sent automatically via LINE chat">ระบบจะส่งรายการอาหารผ่าน LINE chat ให้อัตโนมัติ</span></span>'
          if old not in s:
              raise SystemExit('Hero LINE chip source text not found')
          s = s.replace(old, new, 1)

          old_p = '<p data-lang-th="เลือกเมนูและส่งออเดอร์ผ่าน LINE OA จากนั้นทางร้านจะตอบกลับในแชทตามขั้นตอนเดิม" data-lang-en="Choose your menu and send the order through LINE OA. The restaurant will continue with you in chat as usual.">เลือกเมนูและส่งออเดอร์ผ่าน LINE OA จากนั้นทางร้านจะตอบกลับในแชทตามขั้นตอนเดิม</p>'
          new_p = '<p data-lang-th="เลือกเมนูในระบบ แล้วรายการอาหารจะถูกส่งเข้า LINE chat ให้อัตโนมัติ จากนั้นทางร้านจะตอบกลับในแชทตามขั้นตอนเดิม" data-lang-en="Choose your menu here. Your order list will be sent automatically via LINE chat, then the restaurant will reply in the same chat.">เลือกเมนูในระบบ แล้วรายการอาหารจะถูกส่งเข้า LINE chat ให้อัตโนมัติ จากนั้นทางร้านจะตอบกลับในแชทตามขั้นตอนเดิม</p>'
          if old_p in s:
              s = s.replace(old_p, new_p, 1)

          css_anchor = '.chip-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px rgba(224,189,115,.52); }'
          css_extra = css_anchor + '\n    .chip-long { white-space: normal; line-height: 1.35; max-width: min(100%, 420px); }'
          if css_anchor not in s:
              raise SystemExit('Chip CSS anchor not found')
          s = s.replace(css_anchor, css_extra, 1)

          visual_anchor = '.placeholder-bowl { width: 33px; height: 33px; opacity: .86; }'
          visual_extra = visual_anchor + '\n    .menu-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }\n    .menu-visual.has-photo::before { display: none; }\n    .menu-visual.has-photo::after { background: linear-gradient(180deg, transparent 52%, rgba(14,31,21,.18)); }'
          if visual_anchor not in s:
              raise SystemExit('Menu visual CSS anchor not found')
          s = s.replace(visual_anchor, visual_extra, 1)

          image_map = {
              "{ id: 's1', nameTh: \"ชุดจุ่มหมูทะเล\", nameEn: \"Pork & Sea Food Set\", price: 429, allowAddOn: false }": "{ id: 's1', nameTh: \"ชุดจุ่มหมูทะเล\", nameEn: \"Pork & Sea Food Set\", price: 429, allowAddOn: false, image: 'assets/menu/pork-seafood-set.jpg' }",
              "{ id: 's2', nameTh: \"ชุดจุ่มเนื้อ\", nameEn: \"Beef Shabu Set\", price: 339, allowAddOn: false }": "{ id: 's2', nameTh: \"ชุดจุ่มเนื้อ\", nameEn: \"Beef Shabu Set\", price: 339, allowAddOn: false, image: 'assets/menu/beef-set.jpg' }",
              "{ id: 's3', nameTh: \"ชุดจุ่มหมู\", nameEn: \"Pork Shabu Set\", price: 329, allowAddOn: false }": "{ id: 's3', nameTh: \"ชุดจุ่มหมู\", nameEn: \"Pork Shabu Set\", price: 329, allowAddOn: false, image: 'assets/menu/pork-set.jpg' }",
              "{ id: 's4', nameTh: \"ชุดจุ่มเดี่ยวหมู\", nameEn: \"Single Pork Set\", price: 189, allowAddOn: true }": "{ id: 's4', nameTh: \"ชุดจุ่มเดี่ยวหมู\", nameEn: \"Single Pork Set\", price: 189, allowAddOn: true, image: 'assets/menu/pork-set.jpg' }",
              "{ id: 's5', nameTh: \"อิ่มเดี่ยว ต้มพร้อมทาน\", nameEn: \"Ready to Eat Normal Set\", price: 119, allowAddOn: true, badgeTh: \"⚠️ ไม่เสิร์ฟหลัง 18:00 น.\", badgeEn: \"⚠️ Not served after 6:00 PM\" }": "{ id: 's5', nameTh: \"อิ่มเดี่ยว ต้มพร้อมทาน\", nameEn: \"Ready to Eat Normal Set\", price: 119, allowAddOn: true, image: 'assets/menu/ready-normal.jpg', badgeTh: \"⚠️ ไม่เสิร์ฟหลัง 18:00 น.\", badgeEn: \"⚠️ Not served after 6:00 PM\" }",
              "{ id: 's6', nameTh: \"อิ่มเดี่ยว หมูจุกจุก\", nameEn: \"Ready to Eat Extra Pork Set\", price: 159, allowAddOn: true, badgeTh: \"⚠️ ไม่เสิร์ฟหลัง 18:00 น.\", badgeEn: \"⚠️ Not served after 6:00 PM\" }": "{ id: 's6', nameTh: \"อิ่มเดี่ยว หมูจุกจุก\", nameEn: \"Ready to Eat Extra Pork Set\", price: 159, allowAddOn: true, image: 'assets/menu/ready-extra-pork.jpg', badgeTh: \"⚠️ ไม่เสิร์ฟหลัง 18:00 น.\", badgeEn: \"⚠️ Not served after 6:00 PM\" }",
              "{ id: 'm13', nameTh: \"กุ้ง\", nameEn: \"Shrimp\", price: 69, allowAddOn: false }": "{ id: 'm13', nameTh: \"กุ้ง\", nameEn: \"Shrimp\", price: 69, allowAddOn: false, image: 'assets/menu/shrimp.jpg' }",
              "{ id: 'v1', nameTh: \"ชุดผักรวม\", nameEn: \"Vegetable Combo\", price: 69, allowAddOn: false }": "{ id: 'v1', nameTh: \"ชุดผักรวม\", nameEn: \"Vegetable Combo\", price: 69, allowAddOn: false, image: 'assets/menu/vegetable-combo.jpg' }",
              "{ id: 'a3', nameTh: \"ข้าวเกรียบปลา\", nameEn: \"Crispy Fish Crackers\", price: 49, allowAddOn: false }": "{ id: 'a3', nameTh: \"ข้าวเกรียบปลา\", nameEn: \"Crispy Fish Crackers\", price: 49, allowAddOn: false, image: 'assets/menu/crispy-fish-crackers.jpg' }",
              "{ id: 'a4', nameTh: \"คาลามารี\", nameEn: \"Calamari\", price: 119, allowAddOn: false }": "{ id: 'a4', nameTh: \"คาลามารี\", nameEn: \"Calamari\", price: 119, allowAddOn: false, image: 'assets/menu/calamari.jpg' }",
              "{ id: 'd1', nameTh: \"ซาโมซ่ากล้วย\", nameEn: \"Banana Samosa\", price: 79, allowAddOn: false }": "{ id: 'd1', nameTh: \"ซาโมซ่ากล้วย\", nameEn: \"Banana Samosa\", price: 79, allowAddOn: false, image: 'assets/menu/banana-samosa.jpg' }",
          }
          for old_item, new_item in image_map.items():
              if old_item not in s:
                  raise SystemExit(f'Menu item source not found: {old_item[:50]}')
              s = s.replace(old_item, new_item, 1)

          old_render = 'html += `<article class="menu-card"><div class="menu-visual">${placeholderIcon()}</div><div class="menu-content"><h4 class="menu-name">${itemName}</h4><div class="menu-sub">${subName}</div>${badgeHtml}<div class="menu-price">${item.price} ฿</div>${actionSectionHtml}</div></article>`;'
          new_render = 'const visualHtml = item.image ? `<div class="menu-visual has-photo"><img class="menu-photo" src="${item.image}" alt="${itemName}" loading="lazy" decoding="async"></div>` : `<div class="menu-visual">${placeholderIcon()}</div>`;\n          html += `<article class="menu-card">${visualHtml}<div class="menu-content"><h4 class="menu-name">${itemName}</h4><div class="menu-sub">${subName}</div>${badgeHtml}<div class="menu-price">${item.price} ฿</div>${actionSectionHtml}</div></article>`;'
          if old_render not in s:
              raise SystemExit('Menu render source not found')
          s = s.replace(old_render, new_render, 1)

          p.write_text(s, encoding='utf-8')
          PY

          test -s assets/menu/pork-seafood-set.jpg
          test -s assets/menu/beef-set.jpg
          test -s assets/menu/pork-set.jpg
          test -s assets/menu/ready-normal.jpg
          test -s assets/menu/ready-extra-pork.jpg
          test -s assets/menu/shrimp.jpg
          test -s assets/menu/vegetable-combo.jpg
          test -s assets/menu/crispy-fish-crackers.jpg
          test -s assets/menu/calamari.jpg
          test -s assets/menu/banana-samosa.jpg

          grep -q 'ระบบจะส่งรายการอาหารผ่าน LINE chat ให้อัตโนมัติ' index.html
          grep -q "image: 'assets/menu/pork-seafood-set.jpg'" index.html
          grep -q 'class="menu-photo"' index.html

      - name: Commit permanent menu assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/vendor-canva-menu-images.yml
          git add index.html assets/menu .github/workflows/vendor-canva-menu-images.yml
          git commit -m "Add Canva menu photos and clarify LINE order copy"
          git push
